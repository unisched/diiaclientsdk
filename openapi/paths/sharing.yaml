# Path items: offline sharing (barcode scenario).
# Source: diia_docs/diia_sharing.md §2.6, §2.12.1
DocumentRequest:
  post:
    tags: [Sharing]
    summary: Create a document sharing request (offline / barcode scenario)
    description: |-
      Initiates document sharing at a physical branch: the operator passes the 13-digit
      Code128 barcode generated by the user's Diia app (scanned or entered manually). The
      barcode is valid for 3 minutes and is single-use.

      On success a push notification with the sharing request is sent to the user. When the
      user confirms, the encrypted package is delivered by the Diia app to the partner
      endpoint; the partner must reply `200 {"success": true}` — see
      `diia-partner-receiver.yaml`.

      Use `getDocumentRequestStatus` to track the request.
    operationId: createDocumentRequest
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/requests.yaml#/components/schemas/DocumentRequestCreate'
    responses:
      '200':
        description: Request accepted — a push notification with the sharing request is sent to the user.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/components/schemas/SuccessResponse'
      '400':
        $ref: '../components/responses.yaml#/components/responses/DocumentRequestBadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/NotAuthorized'
      '404':
        $ref: '../components/responses.yaml#/components/responses/BranchNotFound'

DocumentRequestStatus:
  get:
    tags: [Status]
    summary: Get the sharing status by barcode (offline scenario)
    description: >-
      Returns the status of an offline sharing request. Provide `barcode` and/or `requestId` —
      you may also pass only one of them. If a barcode was reused with a new `requestId`, the
      status of the original (already performed) sharing is returned.
    operationId: getDocumentRequestStatus
    parameters:
      - $ref: '../components/parameters.yaml#/components/parameters/BarcodeQuery'
      - $ref: '../components/parameters.yaml#/components/parameters/RequestIdQuery'
    responses:
      '200':
        description: Current status of the sharing request.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/components/schemas/RequestStatusResponse'
            example:
              status: done
      '401':
        $ref: '../components/responses.yaml#/components/responses/NotAuthorized'
      '404':
        $ref: '../components/responses.yaml#/components/responses/DocumentRequestStatusNotFound'
