          kindBody: {name: 'Special marks:', value: ЛЕГКОВИЙ СЕДАН}
          powerKWT: {code: P.2, name: 'Maximum net power (in kW):', value: '150'}
        fileName: vehicle-license-83dc371b-f1c2-4f1a-8606-d8f7940534af-18.02.2025, 14:14:24-1.pdf.p7s.p7e
