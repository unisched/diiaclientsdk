        lastName: Дія
        name: Надія
        patronymic: Володимирівна
        kss: ''
        numident: '123456701'
        passport: ''
        insuredData:
          - edrpo: '05456545'
            companyName: КОМУНАЛЬНЕ ПIДПРИЄМСТВО ПО УТРИМАННЮ ЗЕЛЕНИХ НАСАДЖЕНЬ ОБОЛОНСЬКОГО РАЙОНУ М.КИЄВА
