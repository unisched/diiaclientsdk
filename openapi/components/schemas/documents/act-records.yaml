            department: Печерський відділ державної реєстрації актів цивільного стану у місті Києві Центрального міжрегіонального управління Міністерства юстиції (м. Київ)
            issueDate: '2024-03-09T22:00:00.000Z'
        gender: male
        firstName: Надія
        lastName: Дія
        middleName: Володимирівна
        oldFirstName: Оксана
