# Diia — document sharing metadata (decrypted `encodeData` payload).
# Source: diia_docs/diia_metadata.md
components:
  schemas:
    ErrorDocument:
      type: object
      description: A requested document that could not be shared.
      required: [documentType, result]
      properties:
        documentType:
          $ref: 'common.yaml#/components/schemas/DocumentType'
        result:
          type: integer
          description: Error code for this document (HTTP-like).
          example: 404

    DocumentSharingMetadata:
      type: object
      description: |-
        Decrypted metadata JSON. In the barcode (offline) scenario the envelope contains
        `barcode` instead of `requestId`/`offerRequestId`. The `data` object contains only the
        document types the user actually shared.
      required: [documentTypes, data]
      properties:
        requestId:
          type: string
          description: The `requestId` that the partner passed in the sharing request.
          example: a123456b-0310-3339-1234-123412341234
        offerRequestId:
          type: string
          description: Internal Diia request identifier (not present in barcode sharing).
          example: dd4bac978ced06bc13678d62202d064936fead480aded3741bb26f76b5e9324641df59b8524d083fc296ec57184cb635ce93994caa4c6bd396462d19fb91899d
        barcode:
          type: string
          description: Barcode of the sharing request (barcode scenario only).
          example: '3535267635434'
        errorDocuments:
          type: array
          description: Documents that failed to be shared; an empty array when everything succeeded.
          items:
            $ref: '#/components/schemas/ErrorDocument'
        documentTypes:
          type: array
          description: Document types the user shared.
          items:
            $ref: 'common.yaml#/components/schemas/DocumentType'
        data:
          type: object
          description: Document metadata keyed by document type.
          additionalProperties: false
          properties:
            internal-passport:
              type: array
              items:
                $ref: 'documents/passports.yaml#/components/schemas/InternalPassport'
            foreign-passport:
              type: array
              items:
                $ref: 'documents/passports.yaml#/components/schemas/ForeignPassport'
            taxpayer-card:
              type: array
              items:
                $ref: 'documents/taxpayer.yaml#/components/schemas/TaxpayerCard'
            child-taxpayer-card:
              type: array
              items:
                $ref: 'documents/taxpayer.yaml#/components/schemas/ChildTaxpayerCard'
            reference-internally-displaced-person:
              type: array
              items:
                $ref: 'documents/identity.yaml#/components/schemas/InternallyDisplacedReference'
            user-birth-record:
              type: array
              items:
                $ref: 'documents/birth-records.yaml#/components/schemas/UserBirthRecord'
            birth-certificate:
              type: array
              items:
                $ref: 'documents/birth-records.yaml#/components/schemas/BirthCertificate'
            driver-license:
              type: array
              items:
                $ref: 'documents/vehicle.yaml#/components/schemas/DriverLicense'
            vehicle-license:
              type: array
              items:
                $ref: 'documents/vehicle.yaml#/components/schemas/VehicleLicense'
            student-id-card:
              type: array
              items:
                $ref: 'documents/identity.yaml#/components/schemas/StudentIdCard'
            residence-permit-permanent:
              type: array
              items:
                $ref: 'documents/identity.yaml#/components/schemas/ResidencePermitPermanent'
            residence-permit-temporary:
              type: array
              items:
                $ref: 'documents/identity.yaml#/components/schemas/ResidencePermitTemporary'
            pension-card:
              type: array
              items:
                $ref: 'documents/identity.yaml#/components/schemas/PensionCard'
            education-document:
              type: array
              items:
                $ref: 'documents/education.yaml#/components/schemas/EducationDocument'
            veteran-certificate:
              type: array
              items:
                $ref: 'documents/identity.yaml#/components/schemas/VeteranCertificate'
            name-change-act-record:
              type: array
              items:
                $ref: 'documents/act-records.yaml#/components/schemas/NameChangeActRecord'
            marriage-act-record:
              type: array
              items:
                $ref: 'documents/act-records.yaml#/components/schemas/MarriageActRecord'
            divorce-act-record:
              type: array
              items:
                $ref: 'documents/act-records.yaml#/components/schemas/DivorceActRecord'
            income-report:
              type: array
              items:
                $ref: 'documents/social.yaml#/components/schemas/IncomeReport'
            ok5:
              type: array
              items:
                $ref: 'documents/social.yaml#/components/schemas/Ok5'
            ok7:
              type: array
              items:
                $ref: 'documents/social.yaml#/components/schemas/Ok7'
      example:
        requestId: a123456b-1234-0123-1234-123412341234
        offerRequestId: f41fb60a6d40ca20b3521b37f8167cc4e1e4bc189e5269896972c1ed9258bee04e35d7746a0976584e2a60bb91e2aea3b6bfcd5a75b7c14049e93675ec7ecba5
        errorDocuments:
          - documentType: internal-passport
            result: 404
        documentTypes:
          - foreign-passport
