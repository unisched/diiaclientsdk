# Diia partner receiver API — Sharing & Diia.Sign callbacks (OpenAPI 3.0.3 entry point)
# Sources: diia_docs/diia_sharing.md §2.8–2.11, diia_docs/diia_sign.md §3.7, §4.2.4–4.2.6
openapi: 3.0.3
info:
  title: Diia partner receiver API — Sharing & Diia.Sign callbacks
  version: 2026-09-03
  description: |-
    Contract of the endpoint(s) the partner must expose so that the Diia mobile app can deliver:

    * **shared documents** (barcode and deeplink scenarios) — encrypted metadata, PDF copies and
      signed hashes;
    * **Diia.Sign results** — signed file hashes (`hashedFilesSigning`) or the signed identifier
      (`auth`).

    Endpoint requirements (diia_sharing.md §2.8, diia_sign.md §4.2.4):

    * static endpoint(s) configured for the acquirer account by ДП «Дія»; separate endpoints may
      be set up for barcode sharing, online sharing, signing and authorization;
    * publicly reachable from **any IP address** — packages come directly from users' devices;
      use the `X-Document-Request-Trace-Id` value (`requestId`) to filter unauthorized calls;
    * HTTPS only on port **443** with a non-self-signed certificate; **TLS v1.2** (with TLS 1.3
      requests may not be delivered);
    * keepalive must be supported;
    * respond within **30 seconds** with `200 {"success": true}` on success, or a non-2xx code
      with `{"success": false}` to show the failure screen in the app.

    Decrypted payload shapes (see `x-decrypted-payloads`):

    * sharing callback — `DocumentSharingMetadata` with typed metadata for all 21 document types;
    * signing callback — `SignedItemsEnvelope`;
    * authorization callback — `AuthResultEnvelope`.
servers:
  - url: https://partner.company.com
    description: >-
      Placeholder host — replace it with the endpoint URL configured for your acquirer account
      (`https://partner_company.com/api/diia/documents-receiver` in the original guide).
paths:
  /api/diia/documents-receiver:
    $ref: 'paths/receiver.yaml#/DocumentsReceiver'
  /api/diia/sign-receiver:
    $ref: 'paths/receiver.yaml#/SignReceiver'
  /api/diia/auth-receiver:
    $ref: 'paths/receiver.yaml#/AuthReceiver'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Optional partner client token (`aquirer_client_token` / `Integration:headers:Authorization`)
        that the Diia app sends if it was configured for the endpoint. Validate it when set up.
  schemas:
    DocumentSharingMetadata:
      $ref: 'components/schemas/metadata.yaml#/components/schemas/DocumentSharingMetadata'
    SignedItemsEnvelope:
      $ref: 'components/schemas/receiver.yaml#/components/schemas/SignedItemsEnvelope'
    AuthResultEnvelope:
      $ref: 'components/schemas/receiver.yaml#/components/schemas/AuthResultEnvelope'
x-decrypted-payloads:
  documentSharingMetadata:
    $ref: '#/components/schemas/DocumentSharingMetadata'
  signedItemsEnvelope:
    $ref: '#/components/schemas/SignedItemsEnvelope'
  authResultEnvelope:
    $ref: '#/components/schemas/AuthResultEnvelope'
